# Deconver multi-task A: tuned Deconver + auxiliary patch lesion classifier.
experiment_name: deconver_multitask_a
epochs: 140
batch_size: 2
learning_rate: 1.0e-4
weight_decay: 1.0e-5
num_workers: 5
device: cuda
base_output_dir: /outputs/runs
random_seed: 42
deterministic: false

# Data
images_dir: /data/images
labels_dir: /data/labels
target_spacing: [3.0, 0.5, 0.5]
val_fraction: 0.2

# Patch sampling
patch_size: [16, 128, 128]
pos_fraction: 0.70
num_samples: 1

# Model
model: deconver_multitask
use_t2w: true
use_adc: true
use_hbv: true
out_channels: 1
features: [32, 64, 128, 256]
deep_supervision: true

# Auxiliary patch-level classification head
classification_loss_weight: 0.15
classification_pos_weight: 1.0
classification_dropout: 0.10

# Deconver-specific hyperparameters
deconver_encoder_depth: [1, 1, 1, 1]
deconver_encoder_width: [64, 128, 256, 512]
deconver_strides: [1, 2, 2, 2]
deconver_kernel_size: [3, 3, 3]
deconver_groups: -1
deconver_ndc_ratio: 4

# Loss
loss_fn: tversky_bce
tversky_alpha: 0.3
tversky_beta: 0.7
dice_weight: 1.0
bce_weight: 1.0
bce_pos_weight: 10.0

# LR schedule
warmup_epochs: 8

# Validation (sliding window)
sw_overlap: 0.50
sw_batch_size: 8
val_min_sw_batch_size: 1
val_compute_hd95_every: 1
val_every: 2
val_start_epoch: 1

# Prediction / post-processing
pred_threshold: 0.5
postprocess_enabled: false
postprocess_min_component_volume_mm3: 30.0
postprocess_connectivity: 26

# Training speed optimizations
use_amp: true
amp_dtype: bf16
use_compile: false
cache_mode: storage
cache_rate: 1.0

# Checkpointing
keep_last_checkpoints: 3

# SSL encoder initialization
pretrained_encoder_checkpoint: "/outputs/pretrain_runs/20260505_215426_ssl_pretrain_deconver_mae/checkpoints/best.pt"
freeze_encoder_epochs: 0

# Best checkpoint selection (balanced Dice / sensitivity / HD95)
best_ckpt_w_sensitivity: 0.35
best_ckpt_w_dice: 0.45
best_ckpt_w_hd95: 0.20
best_ckpt_hd95_scale: 25.0

# Early stopping
early_stopping_patience: 50
early_stopping_min_delta: 0.001

# ntfy push notifications
ntfy_url: "https://ntfy.sh"
ntfy_topic: "a9d5ba8d-8e71-4e48-a114-a04a572de12f"
ntfy_notify_best_model: true
