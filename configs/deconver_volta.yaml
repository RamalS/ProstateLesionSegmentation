experiment_name: deconver_tuned_a
epochs: 140
batch_size: 6
learning_rate: 1.0e-4
weight_decay: 1.0e-5
num_workers: 5
device: cuda
base_output_dir: /outputs/runs
random_seed: 42
deterministic: false
task: lesion_segmentation

# Data
dataset_type: picai
images_dir: /data/images
labels_dir: /data/labels
target_spacing: [3.0, 0.5, 0.5]   # (z, y, x) in mm — preserves T2w in-plane res
val_fraction: 0.2

roi:
  mode: gt_mask
  val:
    mode: gt_mask
  target: prostate
  margin_mm: [9.0, 16.0, 16.0]
  min_size_vox: [16, 128, 128]
  fallback_to_full_volume: true
  gt_dataset_types: [prostate158]
  localizer_run: ""
  localizer_threshold: 0.5
  localizer_keep_largest_component: true
  cache_mode: storage
  cache_rate: 1.0
  cache_dir: /cache/roi_cache

# Patch sampling
patch_size: [16, 64, 64]           # (D, H, W) in voxels
pos_fraction: 0.70                 # fraction of patches containing a lesion
num_samples: 1                     # patches extracted per volume per __getitem__ call
                                   # effective batch size = batch_size × num_samples

# Model
model: deconver                    # options: unet3d, attention_unet3d, fct, deconver
modalities: [adc, hbv]             # ordered model input channels
out_channels: 1                    # binary segmentation
features: [32, 64, 128, 256]       # encoder feature map sizes (unet3d / attention_unet3d / fct only)
deep_supervision: false            # auxiliary losses at each decoder level (nnU-Net style)

# Deconver-specific hyperparameters (used only when model: deconver)
# Defaults match the 3-D ISLES'22 configuration from the paper (arXiv:2504.00302).
deconver_encoder_depth: [1, 1, 1, 1]        # number of Deconver blocks per encoder stage
deconver_encoder_width: [64, 128, 256, 512] # feature channels per encoder stage
deconver_strides: [1, 2, 2, 2]              # stride per stage (1 = no downsample at stem)
deconver_kernel_size: [3, 3, 3]             # NDC 3-D kernel size
deconver_groups: -1                          # NDC groups: -1 = one group per channel
deconver_ndc_ratio: 4                        # NDC channel expansion ratio (R = E/C)

# Loss
# loss_fn: "tversky_bce" uses TverskyBCELoss (penalises FN > FP via alpha < beta).
# loss_fn: "dice_bce"    uses the original DiceBCELoss (FP = FN penalty).
loss_fn: dice_bce
tversky_alpha: 0.3                 # FP penalty weight (lower → more FP-tolerant)
tversky_beta: 0.7                  # FN penalty weight (higher → fewer missed lesions)
dice_weight: 1.0                   # weight on Tversky/Dice term
bce_weight: 1.0
bce_pos_weight: 10.0               # positive-voxel weight for BCE term

# LR schedule
warmup_epochs: 8                   # linear warm-up from 10 % → 100 % of learning_rate

# Validation (sliding window)
sw_overlap: 0.35                   # overlap fraction for sliding window inference
sw_batch_size: 24                  # number of patches processed per SW step
val_min_sw_batch_size: 1           # lower bound if validation OOM fallback is triggered
val_compute_hd95_every: 1          # 0 = skip HD95 during training-time validation
val_every: 2                       # run validation every N epochs (also always runs on the final epoch)
val_start_epoch: 1                 # skip validation entirely before this epoch

# Prediction / post-processing
pred_threshold: 0.5                        # sigmoid threshold before binarization
postprocess_enabled: false                 # remove tiny 3-D connected-component outliers
postprocess_min_component_volume_mm3: 30.0
postprocess_connectivity: 26               # 6, 18, or 26

# Training speed optimizations
use_amp: true
amp_dtype: fp16
use_compile: false
cache_mode: ram                    # one of: none | ram | storage
cache_rate: 1.0                    # fraction of dataset to cache (1.0 = all cases)
# dataset_cache_dir: /cache/dataset_cache   # optional override for cache_mode=storage

# Checkpointing
keep_last_checkpoints: 3
# resume_checkpoint: /outputs/runs/<run_name>/checkpoints/epoch_0050.pt

# SSL encoder initialization
pretrained_encoder_checkpoint: "/outputs/pretrained_external/deconver_isles22_fold0_epoch500_model_state_dict.pt"
freeze_encoder_epochs: 0            # >0 freezes encoder for first N epochs

# Best checkpoint selection (composite score)
best_ckpt_w_sensitivity: 0.4
best_ckpt_w_dice: 0.6
best_ckpt_w_hd95: 0.0
best_ckpt_hd95_scale: 10.0

# Early stopping
early_stopping_patience: 50
early_stopping_min_delta: 0.001

# ntfy push notifications
ntfy_url: "https://ntfy.sh"
ntfy_topic: "a9d5ba8d-8e71-4e48-a114-a04a572de12f"
ntfy_notify_best_model: true
