experiment_name: baseline_run
epochs: 5
batch_size: 4
learning_rate: 2.0e-4
weight_decay: 1.0e-5
num_workers: 2
device: cuda
base_output_dir: outputs/runs
random_seed: 42
deterministic: false

# Data
images_dir: data/images
labels_dir: data/labels
target_spacing: [3.0, 0.5, 0.5]
val_fraction: 0.2

# Patch sampling
patch_size: [20, 128, 128]
pos_fraction: 0.75
num_samples: 1                     # patches extracted per volume per __getitem__ call
                                   # effective batch size = batch_size × num_samples

# Model
model: unet3d                      # options: unet3d, attention_unet3d, deconver
use_t2w: true                      # include T2w channel
use_adc: true                      # include ADC channel
use_hbv: true                      # include HBV channel
out_channels: 1
features: [32, 64, 128, 256]       # used by unet3d / attention_unet3d only
deep_supervision: false            # auxiliary losses at each decoder level (nnU-Net style)

# Deconver-specific hyperparameters (used only when model: deconver)
# Defaults match the 3-D ISLES'22 configuration from the paper (arXiv:2504.00302).
deconver_encoder_depth: [1, 1, 1, 1]        # number of Deconver blocks per encoder stage
deconver_encoder_width: [64, 128, 256, 512] # feature channels per encoder stage
deconver_strides: [1, 2, 2, 2]              # stride per stage (1 = no downsample at stem)
deconver_kernel_size: [3, 3, 3]             # NDC 3-D kernel size
deconver_groups: -1                          # NDC groups: -1 = one group per channel
deconver_ndc_ratio: 4                        # NDC channel expansion ratio (R = E/C)

# Loss
dice_weight: 1.0
bce_weight: 1.0
bce_pos_weight: 10.0

# Validation (sliding window)
sw_overlap: 0.5
sw_batch_size: 2
val_min_sw_batch_size: 1           # lower bound if validation OOM fallback is triggered
val_compute_hd95_every: 0          # 0 = skip HD95 during training-time validation
val_every: 1                        # run validation every N epochs (also always runs on the final epoch)
val_start_epoch: 1                  # skip validation entirely before this epoch (1 = no skip)

# Prediction / post-processing
pred_threshold: 0.5                        # sigmoid threshold before binarization
postprocess_enabled: false                 # remove tiny 3-D connected-component outliers
postprocess_min_component_volume_mm3: 30.0
postprocess_connectivity: 26               # 6, 18, or 26

# Training speed optimizations
use_amp: true                     # automatic mixed precision (see amp_dtype below)
amp_dtype: bf16                   # RTX 5070 (Blackwell) has native BF16 tensor cores
use_compile: false                # torch.compile — disable for dev; enable for longer runs
cache_dataset: true               # cache preprocessed volumes in worker RAM after first epoch
cache_rate: 1.0                   # fraction of dataset to cache (1.0 = all cases)

# Checkpointing
keep_last_checkpoints: 3          # number of recent epoch_NNNN.pt files to keep (0 = keep all)
# resume_checkpoint:              # uncomment and set path to resume from a checkpoint
                                  # e.g. resume_checkpoint: outputs/runs/my_run/checkpoints/epoch_0003.pt

# Best checkpoint selection (composite score)
best_ckpt_w_sensitivity: 0.5
best_ckpt_w_dice: 0.3
best_ckpt_w_hd95: 0.0
best_ckpt_hd95_scale: 10.0

# Early stopping (disabled for short local dev runs)
early_stopping_patience: 0
early_stopping_min_delta: 0.001

# ntfy push notifications
# Leave ntfy_url or ntfy_topic empty (or omit them entirely) to disable all
# notifications.  ntfy_notify_best_model can be set to false to suppress the
# per-checkpoint notification while keeping the others.
# Example:
#   ntfy_url: https://ntfy.sh
#   ntfy_topic: my-training-alerts
ntfy_url: ""
ntfy_topic: ""
ntfy_notify_best_model: true
