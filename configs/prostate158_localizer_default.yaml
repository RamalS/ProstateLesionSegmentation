experiment_name: prostate158_localizer
epochs: 300
batch_size: 2
learning_rate: 1.0e-4
weight_decay: 1.0e-5
num_workers: 5
device: cuda
base_output_dir: /outputs/runs
random_seed: 42
deterministic: false
task: prostate_localization

# Data
dataset_type: prostate158
prostate158_train_dir: /data/prostate158_train
prostate158_test_dir: /data/prostate158_test
prostate158_train_split: train
prostate158_val_split: valid
prostate158_test_split: test
prostate158_label_target: tumor
prostate158_label_reader: 1
prostate158_prostate_label_col: t2_anatomy_reader1
images_dir: /data/prostate158_train
labels_dir: /data/prostate158_train
target_spacing: [3.0, 0.5, 0.5]
val_fraction: 0.2

roi:
  mode: disabled
  target: prostate
  margin_mm: [6.0, 12.0, 12.0]
  min_size_vox: [16, 128, 128]
  fallback_to_full_volume: true
  gt_dataset_types: [prostate158]
  localizer_run: ""
  localizer_threshold: 0.5
  localizer_keep_largest_component: true

# Patch sampling
patch_size: [16, 128, 128]
pos_fraction: 0.85
num_samples: 1

# Model
model: deconver
modalities: [t2w]
out_channels: 1
features: [32, 64, 128, 256]
deep_supervision: true

# Deconver-specific hyperparameters
deconver_encoder_depth: [1, 1, 1, 1]
deconver_encoder_width: [64, 128, 256, 512]
deconver_strides: [1, 2, 2, 2]
deconver_kernel_size: [3, 3, 3]
deconver_groups: -1
deconver_ndc_ratio: 4

# Loss
loss_fn: tversky_bce
tversky_alpha: 0.3
tversky_beta: 0.7
dice_weight: 1.0
bce_weight: 1.0
bce_pos_weight: 10.0

# DWI -> HBV preprocessing for Prostate158
dwi_hbv_preprocess:
  enabled: true
  clip_percentiles: [1.0, 99.5]
  log1p: true

# LR schedule
warmup_epochs: 2

# Validation
sw_overlap: 0.50
sw_batch_size: 20
val_min_sw_batch_size: 1
val_compute_hd95_every: 1
val_every: 2
val_start_epoch: 0

# Prediction / post-processing
pred_threshold: 0.5
postprocess_enabled: false
postprocess_min_component_volume_mm3: 30.0
postprocess_connectivity: 26

# Runtime
use_amp: true
amp_dtype: bf16
use_compile: false
cache_mode: storage
cache_rate: 1.0

# Checkpointing
keep_last_checkpoints: 3
pretrained_encoder_checkpoint: ""
freeze_encoder_epochs: 0

# Best checkpoint selection
best_ckpt_w_sensitivity: 0.4
best_ckpt_w_dice: 0.6
best_ckpt_w_hd95: 0.0
best_ckpt_hd95_scale: 10.0

# Early stopping
early_stopping_patience: 50
early_stopping_min_delta: 0.001

ntfy_url: "https://ntfy.sh"
ntfy_topic: "a9d5ba8d-8e71-4e48-a114-a04a572de12f"
ntfy_notify_best_model: true
