experiment_name: swinunetr_learnability
epochs: 120
batch_size: 2
learning_rate: 3.0e-4
weight_decay: 0.0
num_workers: 5
device: cuda
base_output_dir: /outputs/runs
random_seed: 42
deterministic: false
task: lesion_segmentation

# Data
dataset_type: picai
images_dir: /data/images
labels_dir: /data/labels
target_spacing: [3.0, 0.5, 0.5]
val_fraction: 0.2

roi:
  mode: gt_mask
  val:
    mode: gt_mask
  target: prostate
  margin_mm: [9.0, 16.0, 16.0]
  min_size_vox: [32, 128, 128]
  fallback_to_full_volume: true
  gt_dataset_types: [prostate158]
  localizer_run: ""
  localizer_threshold: 0.5
  localizer_keep_largest_component: true
  cache_mode: storage
  cache_rate: 1.0
  cache_dir: /cache/roi_cache

# Patch sampling
patch_size: [32, 128, 128]
pos_fraction: 1.0
num_samples: 4
augmentation_profile: light

# Model
model: swinunetr
modalities: [t2w, adc, hbv]
out_channels: 1
features: [32, 64, 128, 256]
deep_supervision: false

# SwinUNETR-specific hyperparameters
swinunetr_img_size: [32, 128, 128]
swinunetr_feature_size: 12
swinunetr_depths: [2, 2, 2, 2]
swinunetr_num_heads: [3, 6, 12, 24]
swinunetr_norm_name: "instance"
swinunetr_drop_rate: 0.0
swinunetr_attn_drop_rate: 0.0
swinunetr_dropout_path_rate: 0.0
swinunetr_use_checkpoint: true
swinunetr_use_v2: false

# Loss
loss_fn: tversky_bce
tversky_alpha: 0.2
tversky_beta: 0.8
dice_weight: 1.0
bce_weight: 1.0
bce_pos_weight: 75.0

# LR schedule
warmup_epochs: 5

# Validation
sw_overlap: 0.50
sw_batch_size: 4
val_min_sw_batch_size: 1
val_compute_hd95_every: 1
val_every: 1
val_start_epoch: 1

# Prediction / post-processing
pred_threshold: 0.5
postprocess_enabled: false
postprocess_min_component_volume_mm3: 30.0
postprocess_connectivity: 26

# Training speed optimizations
use_amp: true
amp_dtype: bf16
use_compile: false
cache_mode: storage
cache_rate: 1.0

# Checkpointing
keep_last_checkpoints: 3

# SSL encoder initialization
pretrained_encoder_checkpoint: ""
freeze_encoder_epochs: 0

# Best checkpoint selection
best_ckpt_w_sensitivity: 0.0
best_ckpt_w_dice: 1.0
best_ckpt_w_hd95: 0.0
best_ckpt_hd95_scale: 10.0

# Early stopping
early_stopping_patience: 25
early_stopping_min_delta: 0.001

# ntfy push notifications
ntfy_url: "https://ntfy.sh"
ntfy_topic: "a9d5ba8d-8e71-4e48-a114-a04a572de12f"
ntfy_notify_best_model: true
